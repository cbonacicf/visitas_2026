name: Reinicia Aplicación de Visitas 2026

on:
  schedule:
    - cron: '0 8 * 3-11 1,3,5'
    - cron: '32 23 7 4 *'

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Reinicia Servicio
        run: railway restart --service 2ddaa4d8-de34-46c7-82e6-4ad67cd6d4fe --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
